services:
  - type: web
    runtime: python
    name: andessar-earth-trends
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEOPORTAL_DATABASE_URL
        sync: false
      - key: GEOPORTAL_STORAGE_DIR
        value: /tmp/geoportal
      - key: GEOPORTAL_ALLOW_LOCAL_UPLOADS
        value: "false"
